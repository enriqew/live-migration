[project]
name = "live-migration"
version = "0.1.0"
description = "Two bike share systems merged into one database while both keep taking writes."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "aiomysql>=0.3.2",
  "confluent-kafka>=2.6",
  "cryptography>=43",  # MySQL 8 caching_sha2_password: the first login after a restart is RSA
  "fastapi>=0.163.1",
  "fastavro>=1.9",
  "httpx>=0.28.1",
  "psycopg-pool>=3.3.3",
  "psycopg[binary]>=3.2",
  "pymysql>=1.1",
  "tzdata>=2025.2",   # zoneinfo has no system database on Windows
  "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "duckdb>=2.0.0",
    "pytest>=8.3",
    "pytz>=2026.6",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loader", "src/legacy_api", "src/generator", "src/migration", "src/verifier", "src/gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
