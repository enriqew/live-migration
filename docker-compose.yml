# Three databases on one machine: the two legacy systems and the target.
# Images are pinned by digest; the tag is kept beside it for readability.
name: live-migration

services:
  legacy-a:
    # Dublin. Logical decoding is on from the start: CDC is configured in phase 2,
    # and changing wal_level later would need a restart in the middle of a run.
    image: postgres:18.7-bookworm@sha256:ece55f7868da684e400f82f1030a050718adbdd65c23aa500c486f6e2950dc0f
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=8
      - -c
      - max_wal_senders=8
      - -c
      - max_slot_wal_keep_size=4GB
    environment:
      POSTGRES_DB: dublin
      POSTGRES_USER: dublin
      POSTGRES_PASSWORD: dublin
      TZ: UTC
    ports: ["5433:5432"]
    volumes:
      - legacy-a:/var/lib/postgresql
      - ./docker/legacy_a:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dublin -d dublin"]
      interval: 5s
      retries: 20

  legacy-b:
    # Helsinki. Row-based binlog with full row images and GTIDs, which Debezium needs.
    image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    command:
      - --server-id=1
      - --log-bin=binlog
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --local-infile=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: helsinki
      MYSQL_USER: helsinki
      MYSQL_PASSWORD: helsinki
      MYSQL_ROOT_PASSWORD: root
    ports: ["3307:3306"]
    volumes:
      - legacy-b:/var/lib/mysql
      - ./docker/legacy_b:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      retries: 30

  target:
    image: postgres:18.7-bookworm@sha256:ece55f7868da684e400f82f1030a050718adbdd65c23aa500c486f6e2950dc0f
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=8", "-c", "max_wal_senders=8"]
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      TZ: UTC
    ports: ["5434:5432"]
    volumes:
      - target:/var/lib/postgresql
      - ./docker/target:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      retries: 20

  api-a:
    # Dublin's application. Runs on Linux, where psycopg's async mode has its usual event loop.
    build: .
    command: ["uvicorn", "legacy_api.dublin:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      LEGACY_A_DSN: host=legacy-a port=5432 dbname=dublin user=dublin password=dublin
    restart: unless-stopped
    ports: ["8001:8000"]
    depends_on:
      legacy-a: {condition: service_healthy}

  api-b:
    build: .
    command: ["uvicorn", "legacy_api.helsinki:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      LEGACY_B_HOST: legacy-b
      LEGACY_B_PORT: "3306"
    restart: unless-stopped
    ports: ["8002:8000"]
    depends_on:
      legacy-b: {condition: service_healthy}

  kafka:
    # One broker in KRaft mode, acting as its own controller. CDC topics keep everything for a
    # week: a migration must be able to replay from the start of its snapshot.
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_COMPRESSION_TYPE: zstd
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports: ["29092:29092"]
    volumes:
      - kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      retries: 30

  registry:
    # Schemas stored in Kafka itself (KafkaSQL), not in memory: a registry restart in the middle
    # of a migration must not forget the schemas the topics were written with.
    image: apicurio/apicurio-registry:3.3.4@sha256:3ee4423c0f212c364d9525f7ab22ae1a009f610f3e6b8fc2cdba8b2ae68de460
    environment:
      APICURIO_STORAGE_KIND: kafkasql
      APICURIO_KAFKASQL_BOOTSTRAP_SERVERS: kafka:9092
      APICURIO_KAFKASQL_TOPIC_AUTO_CREATE: "true"
    ports: ["8081:8080"]
    depends_on:
      kafka: {condition: service_healthy}

  connect:
    image: quay.io/debezium/connect:3.7.1.Final@sha256:3ae1aa6bb6921b0d47bf95be5c1039c9aa7060a8411eef420ff6dde1f5166580
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: live-migration
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      ENABLE_APICURIO_CONVERTERS: "true"
      CONNECT_TOPIC_CREATION_ENABLE: "true"
    ports: ["8083:8083"]
    depends_on:
      kafka: {condition: service_healthy}
      registry: {condition: service_started}

volumes:
  kafka:
  legacy-a:
  legacy-b:
  target:
